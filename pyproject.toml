[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "file-haven"
version = "0.1.0"
description = "A local-first desktop application for finding and safely cleaning files."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "Send2Trash>=1.8,<2",
    'pyobjc-framework-Cocoa; sys_platform == "darwin"'
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
file-haven = "file_haven.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]